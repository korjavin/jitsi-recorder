services:
  jitsi-recorder:
    # Placeholder tag. .github/workflows/deploy.yml rewrites this line with the
    # commit SHA on the `deploy` branch, which is the branch Portainer watches.
    image: ghcr.io/korjavin/jitsi-recorder:5d58454307496b01bcd03736cb3cc2bcf3ee29c1
    container_name: jitsi-recorder
    # Every variable config.js reads, passed through by name: Compose takes the
    # values from .env next to this file, or from the stack environment when
    # Portainer deploys this repo as a git stack. An unset variable is not
    # passed, so the defaults in config.js stand. See .env.example.
    environment:
      - RECORDER_SECRET
      - JITSI_BASE_URL
      - PORT
      - BOT_DISPLAY_NAME
      - JOIN_TIMEOUT_S
      - MAX_DURATION_S
      - EMPTY_GRACE_S
      - LOG_LEVEL
      # Fixed: tied to the mount below (docs/architecture.md §6).
      - DATA_DIR=/data/jitsi
    volumes:
      # The shared recordings volume; the transcriber reads the artifact paths
      # from the events as they are.
      - recordings:/data
    # Internal only: no ports, no Traefik labels. The orchestrator reaches it as
    # http://jitsi-recorder:8080 over the shared network.
    networks:
      - traefik
    # Chromium needs more than Docker's 64 MB default /dev/shm.
    shm_size: "1g"
    # SIGTERM stops every recording as finished/"signal" and flushes the
    # outbox; give it time.
    stop_grace_period: 120s
    restart: unless-stopped

volumes:
  recordings:
    external: true
    name: ${RECORDINGS_VOLUME:-recordings}

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK_NAME:-traefik}
